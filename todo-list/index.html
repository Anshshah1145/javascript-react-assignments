<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>To-Do List</title>
</head>

<body>

  <div class="todo-container">

    <h1>To-Do List</h1>

        id="taskInput"

    </div>

    <ul id="taskList"></ul>

  </div>

  <script type="module" src="/src/main.js"></script>

</body>
</html>
